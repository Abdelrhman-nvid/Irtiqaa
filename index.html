
<!DOCTYPE html>
<html lang="ar">
    <head>
        <title>Irtiqaa | أرتقاء</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Abdelrhman Abobakr">
        <link rel="stylesheet" href="./Css/main.css">
        <link rel="stylesheet" href="./Css/profile.css">
        <link rel="stylesheet" href="./Css/variables.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    </head>
    
    <body>

        <header class="header" id="header">
            <div class="title">
                <h1 id="h1"><i class="fa-solid fa-chart-line"></i> أرتقاء</h1>
                <span id="head1">Irtiqaa</span>
            </div>
            <div class="profile" id="profile-">
                <div class="profile-info">
                    <div class="profile-user-name username" id="profile-user-name-header">username</div>
                    <div class="profile-level" id="profile-level">Level <span id="profile-level-header">1</span></div>
                </div>
                <div class="profile-image-placeholder"><img src="" id="profile-photo-img"  class="profilePic" alt=""></div>
            </div>
        </header>

        <div class="main-container">

            <aside class="navbar" id="navbar">
                <button data-target="dashboard-view" id="dashboardBtn" class="active navBtn"><i class="fa-solid fa-house"></i> Dashboard</button>
                <button data-target="profile-view" id="profileBtn" class= "notActive navBtn"><i class="fa-solid fa-user"></i> Profile</button>
                <button data-target="commuity-view" id="communityBtn" class= "notActive navBtn"><i class="fa-solid fa-users"></i> Community</button>
                <button data-target="challenges-view" id="challengesBtn" class= "notActive navBtn"><i class="fa-solid fa-trophy"></i> Challenges</button>
                <button data-target="tasks-view" id="tasksBtn" class= "notActive navBtn"><i class="fa-solid fa-clipboard-list"></i> Tasks</button>
                <button data-target="books-view" id="booksBtn" class= "notActive navBtn"><i class="fa-solid fa-book"></i> Books</button>
                <button data-target="setting-view" id="settingBtn" class= "notActive navBtn"><i class="fa-solid fa-gear"></i> Setting</button>
                <button data-target="" id="log-in"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
                <button id="theme-Btn"><i id="theme-icon" class="material-symbols-outlined">dark_mode</i> <span id="theme-text-Btn">Dark</span></button>
            </aside>
            
            <main class="main" id="main">
                
                <div id="dashboard-view" class="dashboard-grid showed view">
                    
                    <div id="level-bar" class="level-bar">
                        <div class="level-meta-top">
                            <span id="level-number">الخبرة: 
                            <span id="xp-bar-num-ar">٠</span>
                            /
                            <span id="xp-next-level-goal-ar">١٠٠٠٠</span>
                        </span>
                            <span id="next-level">المستوى القادم: المستوى <span id="next-level-num-ar">٢</span></span>
                        </div>
                        <div id="xp-bar">
                            <div id="xp-bar-progress"></div>
                        </div>
                        <div class="level-meta-bottom">
                            <span>XP: <span id="xp-bar-num">0</span>/<span id="xp-next-level-goal">10000</span></span>
                            <span>NEXT LEVEL : <span style='padding-left: 4px;'>LEVEL </span><span id="naxt-level-num">2</span></span>
                        </div>
                    </div> 
                    
                    <div class="grid-main-side">
                        <a data-target="" id="welcome-card" class="light-card welcome-banner">
                            <h1 class="welcome-text">ارتقِ بمهاراتك!</h1>
                            <div class="welcome-illustration">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                        </a>
                    </div>
                    <div class="grid-stats-side">
                        <div class="stats-section-title">My stats</div>
                        
                        <div class="stat-row-card">
                            <div class="stat-right-info">
                                <div class="stat-circle-icon xp-icon">XP</div>
                                <div class="stat-texts">
                                    <span class="stat-label">Total XP:</span>
                                    <span class="stat-value" id="total-xp">0</span>
                                </div>
                            </div>
                            <div class="stat-trend-icon"><i class="fa-solid fa-arrow-trend-up"></i></div>
                        </div>
                        
                        <div class="stat-row-card">
                            <div class="stat-right-info">
                                <div class="stat-circle-icon streak-icon"><i class="fa-solid fa-fire"></i></div>
                                <div class="stat-texts">
                                    <span class="stat-label">Daily Streak:</span>
                                    <span class="stat-value" id="streak-text"><span id="streak-day">0</span> Days</span>
                                </div>
                            </div>
                            <div class="stat-trend-icon orange-icon"><i class="fa-solid fa-stopwatch"></i></div>
                        </div>
                        
                        <div class="stat-row-card">
                            <div class="stat-right-info">
                                <div class="stat-circle-icon goal-icon"><i class="fa-solid fa-dumbbell"></i></div>
                                <div class="stat-texts">
                                    <span class="stat-label">Daily Goal:</span>
                                    <span class="stat-sub-value" id="daily-goal-text">Complete a workout</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="badges-container">
                            <div class="badges-title">Achievements (Badges)</div>
                            <div class="badges-flex">
                                <div class="badge-item"><i class="fa-solid fa-dumbbell"></i></div>
                                <div class="badge-item"><i class="fa-solid fa-lightbulb"></i></div>
                                <div class="badge-item"><i class="fa-solid fa-handshake"></i></div>
                            </div>
                        </div>
                    </div>
                    

                </div>
                
                <div id="profile-view" class="profile-view-container hidden view">
                    <div class="profile-header">
                        <div class="avatar-container">
                            <img id="profile-pic" class="profilePic" src="">
                            
                            <div id="image-options-menu" class="image-menu hidden">
                                <button id="profilePicLookOption">👁️ الاطلاع على الصورة</button>
                                <button id="profilePicChangeOption">🔄 تغيير الصورة</button>
                                <input type="file" accept="image/*" class="hidden" id="photoInputProfileFile">
                                <input type="file" id="image-upload-input" class="hidden" accept="image/*">
                            </div>
                        </div>

                        <div class="name-container">
                            <div id="user-name" class="profile-username username">username</div>
                            <button id="edit-name-btn" title="تعديل الاسم" >✏️</button>
                            <form class="hidden" id="editNameMenu">
                                <input type="text" id="editNameInput" placeholder="New username" autocomplete="off">
                                <button type="submit" id="editNameSaveBtn">Save</button>

                            </form>
                        </div>

                        
                        <p class="title">🔥 مطور محارب</p>
                    </div>
                </div>
                     
            </main>

        </div>
        <script src="./Js/variables.js" defer></script>
        <script src="./Js/index.js" defer></script>
    </body>
</html>
